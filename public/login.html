<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FinBuddy AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-gradient"></div>

    <div class="login-container">
        <div class="login-box">
            <!-- Logo -->
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="fas fa-wallet"></i></div>
                FinBuddy <span class="logo-ai">AI</span>
            </a>

            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to your FinBuddy account</p>

            <form id="login-form">
                <div class="input-group">
                    <label for="name">Business Name / User Name</label>
                    <input type="text" id="name" placeholder="e.g. Rahul Stores" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:0.5rem;">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <p style="margin-top:1.75rem; text-align:center; font-size:0.875rem; color:#8FA3C8;">
                Don't have an account?
                <a href="register.html" style="color:#4B7BF5; font-weight:600; margin-left:4px;">Register Now</a>
            </p>
            <p style="margin-top:1rem; text-align:center;">
                <a href="index.html" style="color:#8FA3C8; font-size:0.82rem; display:inline-flex; align-items:center; gap:6px;">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </p>
        </div>
    </div>

    <script src="js/main.js?v=2"></script>
</body>
</html>
